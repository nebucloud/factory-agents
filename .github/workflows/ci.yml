name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: kiln schema dry-run
        run: factory-agents kiln-verify --pipeline config/kiln-verify.example.json
      - name: check payload
        run: >
          factory-agents check
          --diff tests/fixtures/sample.diff
          --sha "${{ github.sha }}"
          --kiln-pipeline config/kiln-verify.example.json
        continue-on-error: true
